  document.getElementById('path').textContent = location.host + requested;

  // "Meintest du …?" – ähnlichsten Tool-Namen suchen
  const slug = s => s.toLowerCase().replace(/^\/+|\/+$/g, '').replace(/\.html?$/i, '');

  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }

  async function suggest() {
    const wanted = slug(requested);
    if (!wanted) return;
    try {
      const res = await fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1');
      if (!res.ok) return;
      const files = (await res.json()).tree
        .filter(f => f.type === 'blob' && /\.html?$/i.test(f.path) && !HIDE.includes(f.path));
      let best = null;
      for (const f of files) {
        const s = slug(f.path);
        const score = s.includes(wanted) || wanted.includes(s) ? 0 : distance(wanted, s);
        if (!best || score < best.score) best = { f, s, score };
      }
      // Nur vorschlagen, wenn es wirklich ähnlich ist
      if (!best || best.score > Math.max(2, Math.floor(wanted.length / 3))) return;
      const name = NAMES[best.f.path] || best.s;
      const hint = document.getElementById('hint');
      hint.textContent = 'Has ti manegià ';
      const a = document.createElement('a');
      a.href = '/' + best.f.path.replace(/\.html?$/i, '');
      a.textContent = name;
      hint.append(a, '?');
      hint.hidden = false;
    } catch { /* Ohne Vorschlag weiter */ }
  }
  suggest();
</script>
