<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<title>Feedback</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff4d64'/%3E%3Cpath d='M24 30h52v32H46l-14 12V62h-8z' fill='none' stroke='white' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Feedback: Liste der Meldungen aus dem Formular in den Tools. Kein like.js, keine Zählung. */
:root{
  --bg:#121214; --card:#1c1c1f; --text:#ececef; --muted:#9a9aa2;
  --accent:#ff4d64; --border:#2f2f34; --mono:#26262a; --err:#ff6b7d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px;padding-block:40px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.homelink{color:var(--muted);text-decoration:none;font-size:.85rem}
.homelink:hover{color:var(--text)}
h1{font-size:1.4rem;margin:4px 0 0;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
form.login{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=password]{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--mono);color:var(--text)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:#121214;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-weight:500;padding:5px 10px;font-size:.8rem}
button.ghost:hover{color:var(--text)}
label.chk{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.msg{font-size:.88rem;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--err)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:.8rem;color:var(--muted)}
.meta b{color:var(--accent);font-weight:600}
.meta .sp{flex:1}
.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:.95rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--mono);border:1px solid var(--border);border-radius:10px;padding:3px}
.tabs button{background:transparent;color:var(--muted);font-weight:600;padding:7px 14px;border-radius:7px;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#121214}
.cnt{font-variant-numeric:tabular-nums;font-size:.78rem;min-width:1.6em;padding:1px 6px;border-radius:999px;background:var(--border);color:var(--text)}
.tabs button[aria-selected="true"] .cnt{background:rgba(0,0,0,.18);color:#121214}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#view:not([hidden]){display:flex;flex-direction:column;gap:14px}
.trash{border:1px solid var(--border);border-radius:12px;background:var(--card)}
.trash summary{cursor:pointer;padding:12px 16px;color:var(--muted);font-size:.9rem;list-style:none;display:flex;justify-content:space-between}
.trash summary::-webkit-details-marker{display:none}
.trash summary::after{content:"▸"}
.trash[open] summary::after{content:"▾"}
.trash .list{padding:0 12px 12px}
.trash .item{background:var(--bg);opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="homelink" href="/">← Tools</a>
    <h1><span class="acc">Feedback</span></h1>
  </header>

  <div class="card" id="login">
    <form class="login" id="lf">
      <input type="password" id="pw" placeholder="Pled-clav" aria-label="Pled-clav" autocomplete="current-password" required>
      <button type="submit">Avrir</button>
      <label class="chk"><input type="checkbox" id="keep"> Memorisar sin quest apparat</label>
    </form>
    <p class="msg" id="lmsg"></p>
  </div>

  <div id="view" hidden>
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="Status">
        <button type="button" role="tab" data-s="nov">Nov <span class="cnt" id="c-nov">0</span></button>
        <button type="button" role="tab" data-s="lavur">En lavur <span class="cnt" id="c-lavur">0</span></button>
        <button type="button" role="tab" data-s="liquida">Liquidà <span class="cnt" id="c-liquida">0</span></button>
      </div>
      <button type="button" class="ghost" id="logout">Serrar</button>
    </div>
    <div class="list" id="list"></div>
    <details class="trash" id="trash">
      <summary>Stizzads</summary>
      <div class="list" id="tlist"></div>
    </details>
  </div>
</div>

<script>
const API = 'https://fragrant-grass-c193.zappa-pfadi.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let pw = '';
try { pw = localStorage.getItem('dbz-fb-pw') || sessionStorage.getItem('dbz-fb-pw') || ''; } catch (e) {}

const fmt = ts => { const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }); };

const LBL = { nov: 'Nov', lavur: 'En lavur', liquida: 'Liquidà' };
let items = [], tab = 'nov';
try { const s = localStorage.getItem('dbz-fb-tab'); if (LBL[s]) tab = s; } catch (e) {}

const card = (i, acts) => `<article class="item" data-id="${i.id}">
  <div class="meta"><b>${esc(i.toolName)}</b><span>${esc(fmt(i.ts))}</span><span>${i.name ? esc(i.name) : 'anonim'}</span><span class="sp"></span><div class="acts">${acts}</div></div>
  <div class="text">${esc(i.text)}</div></article>`;
const btn = (act, label) => `<button type="button" class="ghost" data-act="${act}">${label}</button>`;

function render() {
  const st = i => LBL[i.status] ? i.status : (i.status === 'stizza' ? 'stizza' : 'nov');
  for (const s of Object.keys(LBL)) $('c-' + s).textContent = items.filter(i => st(i) === s).length;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.s === tab)));
  const cur = items.filter(i => st(i) === tab);
  $('list').innerHTML = cur.length ? cur.map(i => card(i,
    Object.keys(LBL).filter(s => s !== tab).map(s => btn('to:' + s, '→ ' + LBL[s])).join('') + btn('to:stizza', 'Stizzar'))).join('')
    : `<p class="empty">Nagins messadis «${LBL[tab]}».</p>`;
  const del = items.filter(i => st(i) === 'stizza');
  $('trash').hidden = !del.length;
  $('tlist').innerHTML = del.map(i => card(i, btn('to:nov', 'Restaurar') + btn('purge', 'Stizzar definitivamain'))).join('');
}

async function load() {
  $('lmsg').className = 'msg'; $('lmsg').textContent = 'Chargiar …';
  try {
    const r = await fetch(API + '/feedback', { headers: { Authorization: 'Bearer ' + pw }, cache: 'no-store' });
    if (r.status === 401) throw new Error('Pled-clav fallì.');
    if (r.status === 503) throw new Error('Il pled-clav n\'è anc betg definì sin il server (FEEDBACK_PASSWORD).');
    if (!r.ok) throw new Error('Las datas n\'han betg pudì vegnir chargiadas.');
    items = (await r.json()).items || [];
    $('login').hidden = true; $('view').hidden = false;
    render();
  } catch (e) {
    $('login').hidden = false; $('view').hidden = true;
    $('lmsg').className = 'msg err'; $('lmsg').textContent = e.message;
  }
}

$('lf').addEventListener('submit', e => {
  e.preventDefault(); pw = $('pw').value;
  try { (($('keep').checked) ? localStorage : sessionStorage).setItem('dbz-fb-pw', pw); } catch (err) {}
  load();
});
$('logout').addEventListener('click', () => {
  pw = ''; try { localStorage.removeItem('dbz-fb-pw'); sessionStorage.removeItem('dbz-fb-pw'); } catch (e) {}
  $('view').hidden = true; $('login').hidden = false; $('pw').value = ''; $('lmsg').textContent = '';
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.s; try { localStorage.setItem('dbz-fb-tab', tab); } catch (e) {} render();
}));
// Status ändern bzw. endgültig löschen (endgültig nur aus «Stizzads», mit zweitem Klick)
document.getElementById('view').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = +b.closest('.item').dataset.id, act = b.dataset.act;
  if (act === 'purge' && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Propi stizzar?'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Stizzar definitivamain'; }, 4000); return; }
  b.disabled = true;
  const r = act === 'purge'
    ? await fetch(API + '/feedback/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + pw } }).catch(() => null)
    : await fetch(API + '/feedback/' + id + '/status', { method: 'POST', headers: { Authorization: 'Bearer ' + pw, 'Content-Type': 'application/json' }, body: JSON.stringify({ status: act.slice(3) }) }).catch(() => null);
  if (!r || !r.ok) { b.disabled = false; b.textContent = 'Betg reussì'; return; }
  if (act === 'purge') items = items.filter(i => i.id !== id); else items.find(i => i.id === id).status = act.slice(3);
  render();
});

if (pw) load(); else $('pw').focus();
</script>
</body>
</html>
