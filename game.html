<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>dombuzz Tools · game</title>
<style>html,body{margin:0;background:#121214}</style>
</head>
<body>
<script>
  // /game spiegelt die Startseite: lädt index.html live und legt game.js obendrauf.
  // So muss nichts doppelt gepflegt werden – jede Änderung an index.html gilt auch hier.
  // Der Seitenaufruf wird als «game» gezählt und erscheint in /stats unter «Autras paginas».
  // Akzentfarbe auf /game: Blau (wie der Rahmen in «Plans da lavur»), damit man sieht, dass man im Spiel-Bereich ist.
  // game.js wird ohne Browser-Cache geladen und direkt eingebettet, damit Änderungen sofort ankommen.
  const nc = { cache: 'no-cache' };
  Promise.all([
    fetch('/index.html', nc).then(r => r.ok ? r.text() : Promise.reject()),
    fetch('/game.js', nc).then(r => r.ok ? r.text() : Promise.reject())
  ]).then(([html, js]) => {
      html = html
        .replace(/ff4d64/gi, '5aa6ff')
        .replace('<title>dombuzz Tools</title>', '<title>dombuzz Tools · game</title>')
        .replace('/view/index?', '/view/game?')
        .replace(/<\/body>(?![\s\S]*<\/body>)/, () => '<script>' + js.replace(/<\/script/gi, '<\\/script') + '<\/script></body>');
      document.open(); document.write(html); document.close();
    })
    .catch(() => { location.replace('/'); });
</script>
</body>
</html>
