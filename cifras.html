<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/theme.js"></script>
<script src="/motion.js" defer></script>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121214">
<meta name="robots" content="noindex">
<meta name="description" content="Cifras: tge tools vegnan duvrads il pli savens e quants artitgels èn cumparids sin rtr.ch.">

<meta property="og:description" content="Cifras: tge tools vegnan duvrads il pli savens e quants artitgels èn cumparids sin rtr.ch.">
<meta property="og:url" content="https://tools.dombuzz.ch/cifras">
<meta property="og:image" content="https://tools.dombuzz.ch/og-hexagon.png">

<title>Cifras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 14 76 76'%3E%3Cg fill='%23ff4d64'%3E%3Crect x='18' y='52' width='18' height='32' rx='3' fill-opacity='.55'/%3E%3Crect x='41' y='22' width='18' height='62' rx='3'/%3E%3Crect x='64' y='40' width='18' height='44' rx='3' fill-opacity='.75'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#121214;--card:#1c1c1f;--text:#ececef;--muted:#9a9aa2;--line:#2f2f34;--accent:#ff4d64;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:max(18px,env(safe-area-inset-top)) 14px 24px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:420px;margin:0 auto;padding-top:20px}
  .top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 10px;margin-bottom:10px}
  h1{font-size:1.2rem;margin:0;letter-spacing:-.01em}h1 span{color:var(--accent)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px}
  .tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
  .tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .rank{color:var(--muted);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
  .name{font-weight:600;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:6px;border-radius:3px;background:var(--rgrad);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 35%,transparent);margin-top:6px;min-width:3px}
  .lab .bar{background:var(--lab)}
  .cnt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;line-height:1.25}
  .cnt small{display:block;font-weight:400;color:var(--muted);font-size:.74rem;white-space:nowrap}
  .hrt{color:var(--accent)}
  .msg{padding:20px 14px;color:var(--muted);text-align:center;font-size:.88rem}
  .ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--accent);font:500 .8rem ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;padding:8px 0;margin:0 0 14px}
  .ticker[hidden]{display:none}
  .ticker span{display:inline-block;padding-left:100%;animation:run var(--dur,40s) linear infinite}
  .ticker:hover span{animation-play-state:paused}
  @keyframes run{to{transform:translateX(-100%)}}
  @media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0;white-space:normal}.ticker{white-space:normal}}
  .homelink{display:inline-block;margin:0 0 10px;font-size:.85rem;color:var(--muted);text-decoration:none}
  .homelink:hover,.homelink:focus-visible{color:var(--accent)}
  h2{font-size:.85rem;font-weight:600;color:var(--muted);margin:26px 0 8px}
  .art{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .art th,.art td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);font-size:.9rem}
  .art th{font-size:.72rem;font-weight:600;color:var(--muted);border-top:0}
  .art th:first-child,.art td:first-child{text-align:left}
  .art td:first-child a{color:var(--text);text-decoration:none}.art td:first-child a:hover{color:var(--accent)}
  .art tr.tot td{font-weight:700}
  .artm{font-size:.74rem;color:var(--muted);margin:8px 2px 0}
  .foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:.78rem}
  .foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="homelink" href="/">← Tools</a>
  <div class="top">
    <h1><span>Cifras</span></h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-r="today" aria-selected="false">oz</button>
      <button class="tab" role="tab" data-r="week" aria-selected="false">emna</button>
      <button class="tab" role="tab" data-r="month" aria-selected="true">mais</button>
      <button class="tab" role="tab" data-r="30d" aria-selected="false">30 dis</button>
      <button class="tab" role="tab" data-r="all" aria-selected="false">tut</button>
    </div>
  </div>
  <div class="ticker" id="ticker" hidden aria-live="off"><span id="tickt"></span></div>
  <div class="card" id="list"><div class="msg">Chargel …</div></div>
  <div class="foot"><span id="meta"></span></div>
  <h2>Artitgels online sin rtr.ch</h2>
  <div class="card" id="artc"><div class="msg">Chargel …</div></div>
</div>
<script>
  const API = 'https://fragrant-grass-c193.zappa-pfadi.workers.dev';
  const SHOW = 5; // Anzahl Einträge
  const NAMES = {
    'rtr-picture': 'RTR Picture-downloader', 'visual': 'Magazin / Il di', 'social': 'Social (survista)', 'social-profil': 'Social · Profil', 'social-novitads': 'Social · Novitads dal di', 'social-mument': 'Social · #mument', 'social-quote': 'Social · Quote solo', 'social-breaking': 'Social · Breaking News', 'social-dumonda': 'Social · Dumonda da l’emna', 'social-cifra': 'Social · Cifra da l’emna', 'social-focus': 'Social · Focus', 'social-novitad': 'Social · Novitad', 'social-pled': 'Social · Pled da l’emna', 'social-thumbnail': 'Social · Thumbnail', 'maletgs': 'Elavurar maletgs', 'Resizer2000': 'Resizer 2000',
    'Plan': 'Plans da teams', 'artitgel': "Links d'artitgels", 'artitgel-challenge': 'Artitgel-challenge', 'audio-recorder': 'Audio-Recorder', 'srt2ttml': 'SRT → TTML', 'studio': 'Subtitle Studio',
    'data': 'Memorisar grafica Datawrapper', 'votaziuns': 'Graficas dumengias da votaziuns', 'avis-votelec': 'Avis sin votaziuns ed elecziuns', 'tschertga': 'Tschertga rtr.ch',
    'lab-csv': 'CSV-Analisa', 'lab-plan2geo': 'Plan → GeoJSON', 'lab-idioms': 'Pleds en ils idioms',
    'lab-hoehenprofil': 'Höhenprofil', 'lab-hockey': 'Hockey regiunal', 'lab-mov': 'PNG → MOV',
    'lab-chat-generator': 'Chat-Generator'
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => n.toLocaleString('de-CH');
  const $ = id => document.getElementById(id);
  const tabs = [...document.querySelectorAll('.tab')];
  const RANGES = ['today', 'week', 'month', '30d', 'all'];
  let range = 'month';
  try { const r = localStorage.getItem('dbz-widget-range'); if (RANGES.includes(r)) range = r; } catch (e) {}
  if (location.hash.slice(1) && RANGES.includes(location.hash.slice(1))) range = location.hash.slice(1);
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.r === range));

  let lastTop = null, lastArt = null;
  // Fliesstext mit Zahlen (wie im Dashboard), nur aus öffentlichen Daten
  function ticker() {
    if (!lastTop) return;
    const { d, list, views } = lastTop, lbl = { all: 'dapi il cumenzament', today: 'oz', week: "quest'emna", '30d': 'ils ultims 30 dis', month: 'quest mais' }[range] || '';
    const items = [];
    if (list[0]) items.push(`★ ${NAMES[list[0].tool] || list[0].tool} sin plaz 1 ${lbl}`);
    if (d.usesTotal) items.push(`${fmt(d.usesTotal)} ${d.usesTotal === 1 ? 'giada' : 'giadas'} duvrà ils tools ${lbl}`);
    if (d.viewsTotal) items.push(`${fmt(d.viewsTotal)} ${d.viewsTotal === 1 ? 'visita' : 'visitas'} ${lbl}`);
    if (d.total) items.push(`♥ ${fmt(d.total)} ${d.total === 1 ? 'cor' : 'cors'} ${lbl}`);
    if (lastArt) { const t = k => ['novitads', 'sport', 'cultura'].reduce((a, s) => a + (lastArt.counts[s][k] || 0), 0);
      items.push(`${fmt(t('week'))} artitgels sin rtr.ch quest'emna`, `${fmt(t('month'))} artitgels sin rtr.ch quest mais`, `${fmt(t('year'))} artitgels sin rtr.ch quest onn`); }
    $('ticker').hidden = !items.length;
    const txt = items.join('   ·   '), el = $('tickt');
    if (el.textContent !== txt) { el.textContent = txt; $('ticker').style.setProperty('--dur', Math.max(25, txt.length / 5) + 's'); }
  }
  async function load() {
    try {
      const r = await fetch(`${API}/top?range=${range}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const likes = Object.fromEntries((d.items || []).map(i => [i.tool, i.count])), views = d.views || {};
      // wie /stats: ohne Lab, nach Nutzungen, dann Likes, dann Name
      const list = [...new Set([...(d.uses || []).map(x => x.tool), ...Object.keys(likes), ...Object.keys(views)])].filter(t => !t.startsWith('lab-'))
        .map(t => ({ tool: t, count: ((d.uses || []).find(x => x.tool === t) || {}).count || 0 }))
        .filter(x => x.count || likes[x.tool] || views[x.tool])
        .sort((a, b) => b.count - a.count || (views[b.tool] || 0) - (views[a.tool] || 0) || (likes[b.tool] || 0) - (likes[a.tool] || 0) || (NAMES[a.tool] || a.tool).localeCompare(NAMES[b.tool] || b.tool, 'de'))
        .slice(0, SHOW);
      const max = Math.max(1, ...list.map(x => x.count));
      $('list').innerHTML = list.length ? list.map((x, i) => `<div class="row${x.tool.startsWith('lab-') ? ' lab' : ''}"><span class="rank">${i + 1}</span>
        <div><div class="name">${esc(NAMES[x.tool] || x.tool)}</div><div class="bar" style="width:${x.count / max * 100}%"></div></div>
        <span class="cnt">${fmt(x.count)}<small>${fmt(views[x.tool] || 0)} visitas · <span class="hrt">♥</span> ${fmt(likes[x.tool] || 0)}</small></span></div>`).join('')
        : '<div class="msg">Anc nagins resultats en quest temp.</div>';
      lastTop = { d, list, views, likes }; ticker();
      $('meta').textContent = `${fmt(d.usesTotal || 0)} giadas duvrà · ${fmt(d.viewsTotal || 0)} visitas`;
    } catch (e) {
      $('list').innerHTML = '<div class="msg">Las datas n\'han betg pudì vegnir chargiadas.</div>'; $('meta').textContent = '';
    }
  }
  // Artitgels publitgads sin rtr.ch/novitads, /sport e /cultura (ord l'agen index da rtr.ch)
  async function loadArt() {
    const el = $('artc');
    try {
      const d = await fetch(API + '/art/count', { cache: 'no-store' }).then(r => r.json());
      lastArt = d; ticker();
      const R = [['novitads', 'Novitads'], ['sport', 'Sport'], ['cultura', 'Cultura']], C = ['week', 'month', '30d', 'year'];
      const sum = k => R.reduce((a, [s]) => a + (d.counts[s][k] || 0), 0);
      const dm = s => s ? s.slice(8, 10).replace(/^0/, '') + '.' + s.slice(5, 7).replace(/^0/, '') + '.' : '';
      el.innerHTML = '<table class="art"><thead><tr><th></th><th title="dapi glindesdi">emna</th><th title="mais actual">mais</th><th title="ultims 30 dis">30 dis</th><th title="quest onn">onn</th></tr></thead><tbody>' +
        R.map(([s, n]) => `<tr><td><a href="https://www.rtr.ch/${s}" target="_blank" rel="noopener">${n}</a></td>${C.map(k => `<td>${fmt(d.counts[s][k])}</td>`).join('')}</tr>`).join('') +
        `<tr class="tot"><td>Total</td>${C.map(k => `<td>${fmt(sum(k))}</td>`).join('')}</tr></tbody></table>`;
      let m = $('artm'); if (!m) { m = document.createElement('p'); m.id = 'artm'; m.className = 'artm'; el.after(m); }
      m.textContent = `Dapi glindesdi ${dm(d.from.week)} · «Il di» dumbrà sco 1 artitgel per di · ultim artitgel en l'index: ${dm(d.newest)}`;
    } catch (e) { el.innerHTML = '<div class="msg">Las datas n\'han betg pudì vegnir chargiadas.</div>'; }
  }
  tabs.forEach(b => b.onclick = () => {
    range = b.dataset.r; tabs.forEach(x => x.setAttribute('aria-selected', x === b));
    try { localStorage.setItem('dbz-widget-range', range); } catch (e) {}
    load();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadArt(); } });
  setInterval(load, 300000);
  load(); loadArt();
</script>
<script>fetch('https://fragrant-grass-c193.zappa-pfadi.workers.dev/view/top'+(window.dbzCid&&dbzCid()?'?c='+dbzCid():''),{method:'POST',keepalive:true}).catch(function(){});</script>
</body>
</html>
