<style>
:root{--bg:#121214;--card:#1c1c1f;--field:#26262a;--text:#ececef;--muted:#9a9aa2;--line:#2f2f34;--border:#2f2f34;--mono:#26262a;--accent:#ff4d64;--accent-dark:#d93a50;--ok:#4caf6f;--warn:#ffb86b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:40px 16px 64px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{position:relative;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.homelink{display:inline-block;margin:0 0 10px;font-size:.85rem;color:var(--muted);text-decoration:none}
.homelink:hover,.homelink:focus-visible{color:var(--accent)}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;align-self:flex-start;border-bottom:1px solid var(--line);margin-top:6px}
.seg button{background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;padding:10px 14px;border-radius:8px 8px 0 0;margin-bottom:-1px;font:inherit;font-weight:600;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--text);border-bottom-color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fontbox{position:absolute;top:0;right:0;max-width:400px;font-size:.8rem;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--muted)}
.fontbox code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.fontbox .btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.82rem;font-weight:600;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer}
.fontbox .btn:hover{color:var(--text)}
.fontbox input{display:none}
@media (max-width:860px){.fontbox{position:static;max-width:none;align-self:flex-end}body{padding-bottom:12px}.wrap{gap:12px}.dbz-like{margin-top:8px!important}.dbz-like p{margin-bottom:6px}}
.sc-tool{min-width:0}
.sc-tool .loading{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="homelink" href="/">← Tools</a>
    <h1><span class="acc">Social</span></h1>
    <p class="sub">Visuals per las medias socialas – tscherner il tab sut.</p>
  </div>
  <div class="seg" id="tabs" role="group" aria-label="Tools"></div>
  <div class="fontbox" id="fontBox" hidden><span id="fontState"></span><label class="btn" id="fontBtn"><span id="fontBtnT">Chargiar scrittiras</span><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" multiple></label></div>
  <div id="tools"></div>
</div>

<script>
/* Tabs: neues Tool = ein Eintrag hier (id = Adresse #id, label = Beschriftung, src = Tool-Seite).
   Die Tool-Seiten werden beim ersten Öffnen geladen und direkt in diese Seite eingebaut (kein iframe):
   Stil wird auf das Tool begrenzt (@scope), IDs bekommen das Kürzel des Tabs, das Skript läuft mit eigenem «document»/«window». */
const TABS = [
  { id: 'profil',   label: 'Profil',          src: '/social-profil.html' },
  { id: 'novitads', label: 'Novitads dal di', src: '/social-novitads.html' },
  { id: 'mument',   label: '#mument',         src: '/social-mument.html' }
];
const $ = id => document.getElementById(id);
let cur = TABS[0];
const mounted = {};   /* id -> { el, ready } */

/* ---------- Tool einbauen ---------- */
const SPLIT = s => { const out = []; let d = 0, c = ''; for (const ch of s) { if (ch === '(' || ch === '[') d++; if (ch === ')' || ch === ']') d--; if (ch === ',' && !d) { out.push(c); c = ''; } else c += ch; } out.push(c); return out; };
function scopeCss(text, t, ids) {
  const pre = t.id + '--';
  const fixSel = sel => SPLIT(sel).map(x => x.trim()).filter(x => x !== ':root').map(x =>
    x.replace(/(^|[\s>+~(])(?:html|body)(?![\w-])/g, '$1:scope').replace(/(^|[\s>+~(])(:root)(?![\w-])/g, '$1:scope')
     .replace(/#([A-Za-z_][\w-]*)/g, (m, n) => ids.has(n) ? '#' + pre + n : m)).join(',');
  const sh = new CSSStyleSheet(); sh.replaceSync(text);
  let inner = '', outer = '';
  const walk = rules => { let o = ''; for (const r of rules) {
    if (r instanceof CSSStyleRule) { const s = fixSel(r.selectorText); if (s) o += s + '{' + r.style.cssText + '}'; }
    else if (r instanceof CSSMediaRule) o += '@media ' + r.conditionText + '{' + walk(r.cssRules) + '}';
    else if (r instanceof CSSSupportsRule) o += '@supports ' + r.conditionText + '{' + walk(r.cssRules) + '}';
    else outer += r.cssText;   /* @font-face, @keyframes … */
  } return o; };
  inner = walk(sh.cssRules);
  return outer + '@scope (.sc-' + t.id + '){' + inner + '}';
}
const EXTRA = {
  profil: '.wrap>div:first-child{display:none}',
  novitads: '.wrap>div:first-child{display:none}',
  mument: '.homelink,h1,.subtitle{display:none}'
};
const COMMON_CSS = ':scope{margin:0;padding:0!important;background:transparent!important;min-height:0!important}' +
  '.themebtn,.dbz-help,.dbz-helpbox{display:none!important}' +
  /* einspaltig: Vorschau oben fixiert (wie /maletgs), Einstellungen scrollen darunter */
  '@media(max-width:860px){.stick{position:sticky!important;top:0!important;z-index:20;background:var(--bg);padding-bottom:4px}.stick .hint,.stick .warn{display:none}.stick .card{padding:10px 12px}.stick .row{gap:6px;margin-bottom:6px!important}}';

function guardWin(real, active, isDoc, root, pre, ids) {
  const GUARD = new Set(['paste', 'keydown', 'keyup', 'drop', 'dragover', 'dragenter', 'dragleave']);
  const fixQ = s => String(s).replace(/#([A-Za-z_][\w-]*)/g, (m, n) => ids.has(n) ? '#' + pre + n : m);
  return new Proxy(real, {
    get(tg, p) {
      if (p === 'addEventListener') return (type, fn, o) => tg.addEventListener(type, GUARD.has(type) ? (e => { if (active()) fn.call(tg, e); }) : fn, o);
      if (isDoc) {
        if (p === 'getElementById') return id => tg.getElementById(pre + id);
        if (p === 'querySelector') return s => root.querySelector(fixQ(s));
        if (p === 'querySelectorAll') return s => root.querySelectorAll(fixQ(s));
      }
      const v = Reflect.get(tg, p); return typeof v === 'function' ? v.bind(tg) : v;
    },
    set(tg, p, v) { tg[p] = v; return true; }
  });
}

async function mount(t) {
  if (mounted[t.id]) return mounted[t.id].ready;
  const el = document.createElement('div'); el.className = 'sc-tool sc-' + t.id; el.hidden = true;
  el.innerHTML = '<p class="loading">Chargiar …</p>';
  $('tools').appendChild(el);
  const m = mounted[t.id] = { el };
  m.ready = (async () => {
    const html = await (await fetch(t.src)).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const css = [...doc.querySelectorAll('style')].map(x => x.textContent).join('\n');
    const js = [...doc.querySelectorAll('script:not([src])')].map(x => x.textContent).join('\n;\n');
    const ids = new Set([...doc.body.querySelectorAll('[id]')].map(x => x.id));
    const pre = t.id + '--';
    const frag = document.createDocumentFragment();
    [...doc.body.childNodes].forEach(n => { if (n.nodeType === 1 && /^(SCRIPT|STYLE|LINK)$/.test(n.tagName)) return; frag.appendChild(document.importNode(n, true)); });
    frag.querySelectorAll('[id]').forEach(x => x.id = pre + x.id);
    frag.querySelectorAll('[for]').forEach(x => { if (ids.has(x.htmlFor)) x.htmlFor = pre + x.htmlFor; });
    const st = document.createElement('style');
    st.textContent = scopeCss(css, t, ids) + '@scope (.sc-' + t.id + '){' + COMMON_CSS + (EXTRA[t.id] || '') + '}';
    el.textContent = ''; el.appendChild(st); el.appendChild(frag);
    const active = () => cur.id === t.id && !document.hidden;
    const D = guardWin(document, active, true, el, pre, ids), W = guardWin(window, active, false);
    try { new Function('document', 'window', js)(D, W); } catch (e) { console.error('social/' + t.id, e); }
    /* Schriften: Karte des Tools ausblenden, Status und Knopf oben anzeigen */
    const ff = el.querySelector('input[type=file][id$="fFile"]'), fs = el.querySelector('[id$="fState"]'), fb = el.querySelector('[id$="fBtn"]');
    if (ff && fs && fb) {
      const card = ff.closest('.card'); if (card) card.style.display = 'none';
      m.font = { ff, fs, fb };
      new MutationObserver(() => { if (cur.id === t.id) showFont(); }).observe(card || fs, { childList: true, subtree: true, characterData: true });
    }
    applyVh();
  })();
  return m.ready;
}

/* Handy: Vorschau nur ca. 20 % der Bildschirmhöhe, damit die Einstellungen darunter sichtbar bleiben */
function applyVh() {
  const mob = innerWidth <= 860;
  for (const id in mounted) { const off = id === 'novitads' ? 150 : 210; mounted[id].el.style.setProperty('--vh', mob ? Math.round(innerHeight * 0.2 + off) + 'px' : '100vh'); }
}

/* ---------- Schriften-Anzeige oben rechts ---------- */
function showFont() {
  const m = mounted[cur.id], f = m && m.font;
  $('fontBox').hidden = !f;
  if (f) { $('fontState').innerHTML = f.fs.innerHTML; $('fontBtnT').textContent = f.fb.firstChild ? f.fb.firstChild.textContent : ''; }
}
$('fontFile').onchange = e => {
  const files = [...e.target.files]; e.target.value = '';
  const m = mounted[cur.id]; if (m && m.font && files.length && m.font.ff.onchange) m.font.ff.onchange({ target: { files, value: '' } });
};

/* ---------- Tabs ---------- */
function pick(h) { const q = String(h || '').replace(/^#/, '').toLowerCase(); return TABS.find(t => t.id === q); }
async function show(t, keepHash) {
  cur = t;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === t.id));
  await mount(t);
  if (cur !== t) return;
  for (const k in mounted) mounted[k].el.hidden = k !== t.id;
  showFont(); applyVh();
  window.dispatchEvent(new Event('resize'));
  try { localStorage.setItem('social-tab', t.id); } catch (e) {}
  if (!keepHash) { try { history.replaceState(null, '', '#' + t.id); } catch (e) {} }
}
TABS.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = t.id; b.textContent = t.label; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => show(t);
  $('tabs').appendChild(b);
});
addEventListener('hashchange', () => { const t = pick(location.hash); if (t && t !== cur) show(t, true); });
addEventListener('resize', applyVh);

/* Nutzung: ein Download in einem Tab zählt als Nutzung von /social (Kennung social-<tab>, vom Worker zu «social» zusammengefasst) */
window.dbzUseTool = () => 'social-' + cur.id;

let start = pick(location.hash);
if (!start) { try { start = pick(localStorage.getItem('social-tab')); } catch (e) {} }
show(start || TABS[0], !!pick(location.hash));
</script>
<script src="/like.js" defer></script>
</body>
