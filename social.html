<style>
:root{--bg:#121214;--card:#1c1c1f;--field:#26262a;--text:#ececef;--muted:#9a9aa2;--line:#2f2f34;--accent:#ff4d64;--accent-dark:#d93a50;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:40px 16px 64px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.homelink{display:inline-block;margin:0 0 10px;font-size:.85rem;color:var(--muted);text-decoration:none}
.homelink:hover,.homelink:focus-visible{color:var(--accent)}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;align-self:flex-start;border-bottom:1px solid var(--line);margin-top:6px}
.seg button{background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;padding:10px 14px;border-radius:8px 8px 0 0;margin-bottom:-1px;font:inherit;font-weight:600;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--text);border-bottom-color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fontbox{position:absolute;top:0;right:0;max-width:400px;font-size:.8rem;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--muted)}
.fontbox code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.fontbox .btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.82rem;font-weight:600;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer}
.fontbox .btn:hover{color:var(--text)}
.fontbox input{display:none}
.head{position:relative}
@media (max-width:760px){.fontbox{position:static;align-items:flex-start;text-align:left;margin-top:8px}}
.frames{position:relative}
.frames iframe{display:block;width:100%;height:600px;border:0;background:transparent;color-scheme:normal}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="fontbox" id="fontBox" hidden><span id="fontState"></span><label class="btn" id="fontBtn"><span id="fontBtnT">Chargiar scrittiras</span><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" multiple></label></div>
    <a class="homelink" href="/">← Tools</a>
    <h1><span class="acc">Social</span></h1>
    <p class="sub">Visuals per las medias socialas – tscherner il tab sut.</p>
  </div>
  <div class="seg" id="tabs" role="group" aria-label="Tools"></div>
  <div class="frames" id="frames"></div>
</div>

<script>
/* Tabs: neues Tool = ein Eintrag hier (id = Adresse #id, label = Beschriftung, src = Seite, die im Rahmen geladen wird).
   Die Seite selbst muss das Skript /social-embed.js laden (Embed-Modus + Nutzungsmeldung). */
const TABS = [
  { id: 'profil',   label: 'Profil',         src: '/social-profil' },
  { id: 'novitads', label: 'Novitads dal di', src: '/social-novitads' },
  { id: 'mument',   label: '#mument',        src: '/social-mument' }
];
const $ = id => document.getElementById(id);
let cur = TABS[0];
const frames = {};
const fontInfo = {};
function showFont() {
  const i = fontInfo[cur.id];
  $('fontBox').hidden = !i;
  if (i) { $('fontState').innerHTML = i.html; $('fontBtnT').textContent = i.btn; }
}
$('fontFile').onchange = e => {
  const files = [...e.target.files]; e.target.value = '';
  const f = frames[cur.id]; if (f && f.contentWindow && files.length) f.contentWindow.postMessage({ dbzFontFiles: files }, location.origin);
};

function pick(h) { const q = String(h || '').replace(/^#/, '').toLowerCase(); return TABS.find(t => t.id === q); }
/* Kein eigener Scroll-Container: Rahmen wachsen mit dem Inhalt (Höhe meldet die Seite selbst), die Seite scrollt */
function sendView() {
  const f = frames[cur.id]; if (!f || !f.contentWindow) return;
  const r = f.getBoundingClientRect();
  f.contentWindow.postMessage({ dbzView: { vh: window.innerHeight, off: -r.top } }, location.origin);
}
function fit() { sendView(); }
function show(t, keepHash) {
  cur = t;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === t.id));
  if (!frames[t.id]) {
    const f = document.createElement('iframe');
    f.title = t.label; f.loading = 'eager'; f.src = t.src;
    f.allow = 'clipboard-read; clipboard-write';
    $('frames').appendChild(f); frames[t.id] = f;
  }
  for (const k in frames) frames[k].hidden = k !== t.id;
  showFont();
  fit();
  try { localStorage.setItem('social-tab', t.id); } catch (e) {}
  if (!keepHash) { try { history.replaceState(null, '', '#' + t.id); } catch (e) {} }
}
TABS.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = t.id; b.textContent = t.label; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => show(t);
  $('tabs').appendChild(b);
});
addEventListener('hashchange', () => { const t = pick(location.hash); if (t && t !== cur) show(t, true); });
addEventListener('resize', fit);
let raf = 0;
addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; sendView(); }); }, { passive: true });

/* Nutzung: ein Download in einem Tab zählt als Nutzung von /social (Kennung social-<tab>, vom Worker zu «social» zusammengefasst) */
window.dbzUseTool = () => 'social-' + cur.id;
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.dbzFont) {
    const k = Object.keys(frames).find(k => frames[k].contentWindow === e.source);
    if (k) { fontInfo[k] = e.data.dbzFont; if (k === cur.id) showFont(); }
    return;
  }
  if (e.data.dbzH || e.data.dbzReady) {
    const k = Object.keys(frames).find(k => frames[k].contentWindow === e.source);
    if (k && e.data.dbzH) frames[k].style.height = e.data.dbzH + 'px';
    sendView(); return;
  }
  if (!e.data.dbzUse) return;
  if (!TABS.some(t => t.id === e.data.dbzUse)) return;
  window.dispatchEvent(new Event('dbz-success'));
});

let start = pick(location.hash);
if (!start) { try { start = pick(localStorage.getItem('social-tab')); } catch (e) {} }
show(start || TABS[0], !!pick(location.hash));
</script>
<script src="/like.js" defer></script>
</body>
</html>
