<style>
  :root {
    --bg: #121214; --card: #1c1c1f; --field: #26262a; --text: #ececef; --muted: #9a9aa2;
    --line: #2f2f34; --accent: #ff4d64; --link: #ff4d64; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .select { position: relative; }
  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    padding: 14px 44px 14px 16px; font: inherit; font-weight: 600; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; outline: none;
  }
  select:hover, select:focus { border-color: var(--accent); }
  select:disabled { cursor: default; color: var(--muted); }
  .select::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  option { background: var(--card); color: var(--text); font-weight: 400; }
  .msg { color: var(--muted); margin-top: 16px; }
  .msg a, footer a { color: var(--link); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>dombuzz <span>Tools</span></h1>
  <p class="sub">Tscherner in tool, el s'avra directamain.</p>
  <div class="select">
    <select id="tools" aria-label="Tscherner in tool" disabled>
      <option value="">Chargel ils tools …</option>
    </select>
  </div>
  <p class="msg" id="msg" hidden></p>
</main>

<script>
  // Einstellungen
  const REPO = 'dombuzz/tools';
  const BRANCH = 'main';
  const HIDE = ['index.html', '404.html', 'bau.html', 'eli.html',
                'suncal.html', 'sunhome.html', 'termica.html']; // erscheinen nicht in der Liste

  // Anzeigenamen im Dropdown (Dateiname -> Name). Nicht aufgeführte Dateien zeigen ihren <title>.
  const NAMES = {
    'rtr-picture.html': 'RTR Telechargiar maletgs',
    'data.html':        'Memorisar grafica Datawrapper',
    'votgr.html':       'Chartas votaziuns GR',
    'subs.html':        'Suttitels RM → DE',
    'srt2ttml.html':    'SRT → TTML',
    'Resizer2000.html': 'Resizer 2000',
    'visual.html':      'Magazin / Il di'
  };

  // Reihenfolge im Dropdown. Nicht aufgeführte Dateien folgen alphabetisch.
  const ORDER = ['rtr-picture.html', 'Resizer2000.html', 'visual.html', 'srt2ttml.html', 'subs.html', 'data.html', 'votgr.html'];

  const sel = document.getElementById('tools');
  const msg = document.getElementById('msg');

  // Pfad -> Adresse ohne .html ("votgr.html" -> "votgr")
  const toUrl = p => p.replace(/(^|\/)index\.html?$/i, '$1').replace(/\.html?$/i, '');

  async function titleOf(url, fallback) {
    try {
      const res = await fetch('/' + url);
      if (!res.ok) return fallback;
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      return (doc.title || '').trim() || fallback;
    } catch { return fallback; }
  }

  async function load() {
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const files = (await res.json()).tree
        .filter(f => f.type === 'blob' && /\.html?$/i.test(f.path) && !HIDE.includes(f.path));
      const tools = await Promise.all(files.map(async f => {
        const url = toUrl(f.path);
        const pos = ORDER.indexOf(f.path);
        return { url, pos, title: NAMES[f.path] || await titleOf(url, f.path.split('/').at(-1).replace(/\.html?$/i, '')) };
      }));
      tools.sort((a, b) => (a.pos < 0 ? 1e9 : a.pos) - (b.pos < 0 ? 1e9 : b.pos) || a.title.localeCompare(b.title, 'de'));

      sel.innerHTML = '';
      sel.append(new Option(tools.length ? 'Tscherner in tool …' : 'Nagins tools chattads', ''));
      for (const t of tools) sel.append(new Option(t.title, '/' + t.url));
      sel.disabled = !tools.length;
    } catch (e) {
      sel.innerHTML = '<option value="">Glista betg disponibla</option>';
      msg.hidden = false;
      msg.innerHTML = 'La glista n\'ha betg pudì vegnir chargiada (' + e.message +
        '). Per plaschair chargiar pli tard da nov u guardar directamain en il <a href="https://github.com/' + REPO + '">repository</a>.';
    }
  }

  sel.addEventListener('change', () => { if (sel.value) location.href = sel.value; });
  // Beim Zurückkehren mit dem Zurück-Button wieder auf "Tool wählen" stellen
  window.addEventListener('pageshow', () => { sel.selectedIndex = 0; });
  load();
</script>
</body>
