<style>
  :root {
    --bg: #121214; --card: #1c1c1f; --field: #26262a; --text: #ececef; --muted: #9a9aa2;
    --line: #2f2f34; --accent: #ff4d64; --link: #ff4d64; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .toplink {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
    border: 1px solid var(--line); background: var(--field); transition: border-color .15s, background .15s;
  }
  .toplink svg { width: 20px; height: 20px; }
  @media (max-width: 600px) { .toplink { width: 29px; height: 29px; border-radius: 8px; } .toplink svg { width: 16px; height: 16px; } }
  .toplink:hover, .toplink:focus-visible { border-color: var(--accent); background: var(--wash); outline: none; }
  /* Top-5 als Pop-up am Symbol */
  .head { position: relative; }
  .pop { position: absolute; z-index: 30; right: 0; top: calc(100% + 8px); width: min(340px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.55); overflow: hidden; opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden; transition: opacity .15s, transform .15s, visibility .15s; }
  .pop.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
  .pop-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .pop-h b { font-size: .95rem; } .pop-h b span { color: var(--accent); }
  .ptabs { display: flex; gap: 4px; }
  .ptab { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: .75rem; font-weight: 600; cursor: pointer; }
  .ptab[aria-selected=true] { background: var(--accent); border-color: var(--accent); color:var(--on-accent); }
  .prow { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .prow:first-of-type { border-top: 0; }
  .prow:hover .pname { color: var(--accent); }
  .prank { color: var(--muted); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
  .pname { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar { height: 4px; border-radius: 2px; background: var(--accent); margin-top: 5px; min-width: 3px; }
  .pcnt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; line-height: 1.25; font-size: .9rem; }
  .pcnt small { display: block; font-weight: 400; color: var(--muted); font-size: .72rem; }
  .pcnt small i { font-style: normal; color: var(--accent); }
  .pmsg { padding: 18px 14px; color: var(--muted); text-align: center; font-size: .85rem; }
  .pfoot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .select { position: relative; }
  .sel-btn {
    width: 100%; text-align: left; padding: 14px 44px 14px 16px; font: inherit; font-weight: 600; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; outline: none;
  }
  .sel-btn:hover, .sel-btn:focus-visible, .sel-btn[aria-expanded=true] { border-color: var(--accent); }
  .select::after {
    content: ""; position: absolute; right: 18px; top: 24px; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none; transition: transform .15s;
  }
  .select.open::after { transform: translateY(-20%) rotate(225deg); }
  .menu {
    position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 8px); display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35); max-height: calc(100vh - 260px); max-height: calc(100dvh - 260px); overflow-y: auto;
  }
  .select.open .menu { display: block; }
  .mg { margin: 10px 10px 2px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .mi { display: block; padding: 8px 12px; border-radius: 9px; color: var(--text); text-decoration: none; font-weight: 500; }
  .mi:hover, .mi:focus-visible { background: var(--field); outline: none; }
  /* aufklappbare Untergruppe innerhalb einer Gruppe */
  .ms { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--text); font: inherit; font-weight: 500; text-align: left; cursor: pointer; }
  .ms:hover, .ms:focus-visible { background: var(--field); outline: none; }
  .ms::after { content: ""; width: 7px; height: 7px; margin-right: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  .ms[aria-expanded=true]::after { transform: rotate(45deg); }
  .msub { display: none; margin: 0 0 2px 14px; padding-left: 4px; border-left: 2px solid var(--line); }
  .msub.on { display: block; }
  .mi.lab { color: var(--lab); font-weight: 700; margin-top: 8px; border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; padding-top: 12px; }
  .msg { color: var(--muted); margin-top: 16px; }
  .msg a, footer a { color: var(--link); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  /* top-Tools-Knopf neben dem Hell/Dunkel-Umschalter (oben rechts, fixiert) */
  .toplink { position: fixed; top: 12px; right: 52px; z-index: 50; width: 32px; height: 32px; padding: 0; border-radius: 50%; background: var(--card); opacity: .7; transition: opacity .15s, border-color .15s, background .15s; }
  .toplink svg { width: 16px; height: 16px; }
  @media (max-width: 600px) { .toplink { width: 32px; height: 32px; border-radius: 50%; } .toplink svg { width: 16px; height: 16px; } }
  .toplink:hover, .toplink:focus-visible, .toplink[aria-expanded="true"] { opacity: 1; border-color: var(--accent); background: var(--field); }
  .pop { position: fixed; z-index: 60; right: 12px; top: 52px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>dombuzz <span>Tools</span></h1>
    <a class="toplink" id="toplink" href="/top" title="top Tools" aria-label="top Tools" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="12 14 76 76" aria-hidden="true"><g fill="#ff4d64"><rect x="18" y="52" width="18" height="32" rx="3" fill-opacity=".55"/><rect x="41" y="22" width="18" height="62" rx="3"/><rect x="64" y="40" width="18" height="44" rx="3" fill-opacity=".75"/></g></svg>
    </a>
    <div class="pop" id="pop" role="dialog" aria-label="top Tools">
      <div class="pop-h"><b>top <span>Tools</span></b>
        <div class="ptabs"><button class="ptab" data-r="month" aria-selected="true">mais</button><button class="ptab" data-r="30d" aria-selected="false">30 dis</button><button class="ptab" data-r="all" aria-selected="false">tut</button></div></div>
      <div id="plist"><div class="pmsg">Chargel …</div></div>
      <div class="pfoot" id="pmeta"></div>
    </div>
  </div>
  <p class="sub">Tscherner in tool, el s'avra directamain.</p>
  <div class="select" id="selwrap">
    <button type="button" class="sel-btn" id="selbtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Tscherner in tool …</button>
    <div class="menu" id="menu" role="menu"></div>
  </div>
</main>

<script>
  // Anzeigenamen im Dropdown (Dateiname -> Name).
  const NAMES = {
    'rtr-picture.html':    'RTR Picture-downloader',
    'visual.html':         'Magazin / Il di',
    'layers.html':         'Layers',
    'colurs.html':         'Colurs',
    'Resizer2000.html':    'Resizer 2000',
    'Plan.html':           'Plans da teams',
    'artitgel.html':       "Links d'artitgels",
    'audio-recorder.html': 'Audio-Recorder',
    'srt2ttml.html':       'SRT → TTML',
    'subs.html':           'Suttitels RM → DE',
    'data.html':           'Memorisar grafica Datawrapper',
    'votgr.html':          'Chartas votaziuns GR'
  };

  // Gruppen und Reihenfolge im Dropdown.
  const GROUPS = [
    // Ein Eintrag [Name, [...]] innerhalb einer Gruppe wird zur aufklappbaren Untergruppe.
    ['Maletgs',           ['rtr-picture.html', 'visual.html', ['Elavurar maletgs', ['colurs.html', 'layers.html', 'Resizer2000.html']]]],
    ['Redacziun',         ['Plan.html', 'artitgel.html']],
    ['Audio e suttitels', ['audio-recorder.html', 'srt2ttml.html', 'subs.html']],
    ['Grafica',           ['data.html', 'votgr.html']]
  ];

  const wrap = document.getElementById('selwrap'), btn0 = document.getElementById('selbtn'), menu = document.getElementById('menu');
  // Menü direkt aus GROUPS aufbauen (kein Laden über GitHub nötig).
  // Neues Tool: Dateiname in NAMES und in einer Gruppe eintragen.
  const mk = (txt, href, cls) => { const a = document.createElement('a'); a.className = 'mi' + (cls ? ' ' + cls : ''); a.href = href; a.textContent = txt; a.setAttribute('role', 'menuitem'); return a; };
  const toolLink = p => mk(NAMES[p] || p, '/' + p.replace(/\.html?$/i, ''));
  // offene Untergruppen merken (pro Browser)
  let subOpen = {};
  try { subOpen = JSON.parse(localStorage.getItem('dbz-subgroups') || '{}') || {}; } catch (e) {}
  const saveSub = () => { try { localStorage.setItem('dbz-subgroups', JSON.stringify(subOpen)); } catch (e) {} };
  let subN = 0;
  for (const [label, paths] of GROUPS) {
    const h = document.createElement('div'); h.className = 'mg'; h.textContent = label; menu.append(h);
    for (const p of paths) {
      if (!Array.isArray(p)) { menu.append(toolLink(p)); continue; }
      const [sub, subPaths] = p, id = 'msub' + (++subN);
      const t = document.createElement('button');
      t.type = 'button'; t.className = 'ms'; t.textContent = sub; t.setAttribute('aria-controls', id);
      const box = document.createElement('div'); box.className = 'msub'; box.id = id;
      for (const sp of subPaths) box.append(toolLink(sp));
      const set = o => { box.classList.toggle('on', o); t.setAttribute('aria-expanded', o); };
      set(!!subOpen[sub]);
      t.addEventListener('click', e => { e.stopPropagation(); const o = !box.classList.contains('on'); set(o); subOpen[sub] = o; saveSub(); });
      menu.append(t, box);
    }
  }
  // ganz unten: Link ins Lab (Experimente)
  menu.append(mk('Lab 🧪', '/lab/', 'lab'));

  // nur sichtbare Einträge (Links und Untergruppen-Knöpfe) für die Pfeiltasten
  const items = () => [...menu.querySelectorAll('.mi, .ms')].filter(el => el.offsetParent !== null);
  const setOpen = o => { wrap.classList.toggle('open', o); btn0.setAttribute('aria-expanded', o); };
  btn0.addEventListener('click', () => setOpen(!wrap.classList.contains('open')));
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) setOpen(false); });
  wrap.addEventListener('keydown', e => {
    const open = wrap.classList.contains('open');
    if (e.key === 'ArrowDown' && !open) setOpen(true);
    const list = items(), i = list.indexOf(document.activeElement);
    if (e.key === 'Escape' && open) { setOpen(false); btn0.focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); list[(i <= 0 ? list.length : i) - 1].focus(); }
  });
  // Beim Zurückkehren mit dem Zurück-Button Menü wieder schliessen
  window.addEventListener('pageshow', () => setOpen(false));

// Top 5 als Pop-up am Symbol (ohne Seitenwechsel; /top bleibt als Ausweichlink)
(() => {
  const API = 'https://fragrant-grass-c193.zappa-pfadi.workers.dev', SHOW = 5;
  const PN = { 'rtr-picture': 'RTR Picture-downloader', 'visual': 'Magazin / Il di', 'layers': 'Layers', 'colurs': 'Colurs', 'Resizer2000': 'Resizer 2000', 'Plan': 'Plans da teams', 'artitgel': "Links d'artitgels",
    'audio-recorder': 'Audio-Recorder', 'srt2ttml': 'SRT → TTML', 'subs': 'Suttitels RM → DE', 'data': 'Memorisar grafica Datawrapper', 'votgr': 'Chartas votaziuns GR' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => n.toLocaleString('de-CH');
  const btn = document.getElementById('toplink'), pop = document.getElementById('pop');
  const tabs = [...pop.querySelectorAll('.ptab')];
  let range = 'month', loadedAt = 0;
  try { const r = localStorage.getItem('dbz-widget-range'); if (['month', '30d', 'all'].includes(r)) range = r; } catch (e) {}
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.r === range));
  async function load() {
    const list = document.getElementById('plist');
    try {
      const r = await fetch(`${API}/ranking?range=${range}`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const likes = Object.fromEntries((d.items || []).map(i => [i.tool, i.count]));
      const rows = (d.uses || []).filter(x => !x.tool.startsWith('lab-') && (x.count || x.likes)).slice(0, SHOW);
      const max = Math.max(1, ...rows.map(x => x.count));
      list.innerHTML = rows.length ? rows.map((x, i) => `<a class="prow" href="/${encodeURIComponent(x.tool)}"><span class="prank">${i + 1}</span>
        <div><div class="pname">${esc(PN[x.tool] || x.name || x.tool)}</div><div class="pbar" style="width:${x.count / max * 100}%"></div></div>
        <span class="pcnt">${fmt(x.count)}<small><i>♥</i> ${fmt(x.likes || likes[x.tool] || 0)}</small></span></a>`).join('')
        : '<div class="pmsg">Anc nagins resultats en quest temp.</div>';
      document.getElementById('pmeta').textContent = `${fmt(d.usesTotal || 0)} giadas duvrà`;
      loadedAt = Date.now();
    } catch (e) { list.innerHTML = '<div class="pmsg">Las datas n\'han betg pudì vegnir chargiadas.</div>'; }
  }
  const open = o => {
    pop.classList.toggle('on', o); btn.setAttribute('aria-expanded', o);
    if (o) fetch(API + '/view/top-popup?t=' + (document.documentElement.dataset.theme === 'light' ? 'light' : 'dark') + (window.dbzCid && dbzCid() ? '&c=' + dbzCid() : ''), { method: 'POST', keepalive: true }).catch(() => {}); // Klick aufs Symbol zählen
    if (o && Date.now() - loadedAt > 60000) load();
  };
  btn.addEventListener('click', e => { e.preventDefault(); open(!pop.classList.contains('on')); });
  document.addEventListener('click', e => { if (!pop.contains(e.target) && !btn.contains(e.target)) open(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { open(false); btn.focus(); } });
  tabs.forEach(b => b.onclick = () => {
    range = b.dataset.r; tabs.forEach(x => x.setAttribute('aria-selected', x === b));
    try { localStorage.setItem('dbz-widget-range', range); } catch (e) {}
    load();
  });
})();
</script>
<script>fetch('https://fragrant-grass-c193.zappa-pfadi.workers.dev/view/index?t='+(document.documentElement.dataset.theme==='light'?'light':'dark')+(window.dbzCid&&dbzCid()?'&c='+dbzCid():''),{method:'POST',keepalive:true}).catch(function(){});</script>
</body>
</html>
