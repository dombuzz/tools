<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<script src="/motion.js" defer></script>

<title>dombuzz Tools</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAAtJElEQVR42u19eZxcVZn2c865S229pdfaq7ur13Q2KjvBTkTGCCogdJgZBB0+NoclIAyCAp2AEUWEYRkUd9RRpluFQQ2LSAgEiNCdPZ21k9739KLd+733nO+PquoukqgdVizKYOSJ90o+Z0vXwP6Q8j417f7q7gA9K9R9QAA">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #121214; --card: #1c1c1f; --field: #26262a; --text: #ececef; --muted: #9a9aa2;
    --line: #2f2f34; --accent: #ff4d64; --link: #ff4d64; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .toplink {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
    border: 1px solid var(--line); background: var(--field); transition: border-color .15s, background .15s;
  }
  .toplink svg { width: 20px; height: 20px; }
  @media (max-width: 600px) { .toplink { width: 29px; height: 29px; border-radius: 8px; } .toplink svg { width: 16px; height: 16px; } }
  .toplink:hover, .toplink:focus-visible { border-color: var(--accent); background: var(--wash); outline: none; }
  /* Top-5 als Pop-up am Symbol */
  .head { position: relative; }
  .pop { position: absolute; z-index: 30; right: 0; top: calc(100% + 8px); width: min(340px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.55); overflow: hidden; opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden; transition: opacity .15s, transform .15s, visibility .15s; }
  .pop.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
  .pop-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .pop-h b { font-size: .95rem; } .pop-h b span { color: var(--accent); }
  .ptabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .ptab { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: .75rem; font-weight: 600; cursor: pointer; }
  .ptab[aria-selected=true] { background: var(--accent); border-color: var(--accent); color:var(--on-accent); }
  .prow { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .prow:first-of-type { border-top: 0; }
  .prow:hover .pname { color: var(--accent); }
  .prank { color: var(--muted); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
  .pname { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar { height: 5px; border-radius: 3px; background:var(--rgrad);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 35%,transparent); margin-top: 6px; min-width: 3px; }
  .pcnt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; line-height: 1.25; font-size: .9rem; }
  .pcnt small { display: block; font-weight: 400; color: var(--muted); font-size: .72rem; }
  .pcnt small i { font-style: normal; color: var(--accent); }
  .pmsg { padding: 18px 14px; color: var(--muted); text-align: center; font-size: .85rem; }
  .pfoot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .select { position: relative; }
  .sel-btn {
    width: 100%; text-align: left; padding: 14px 44px 14px 16px; font: inherit; font-weight: 600; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; outline: none;
  }
  .sel-btn:hover, .sel-btn:focus-visible, .sel-btn[aria-expanded=true] { border-color: var(--accent); }
  .select::after {
    content: ""; position: absolute; right: 18px; top: 24px; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none; transition: transform .15s;
  }
  .select.open::after { transform: translateY(-20%) rotate(225deg); }
  .menu {
    position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 8px); display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35); max-height: calc(100vh - 260px); max-height: calc(100dvh - 260px); overflow-y: auto;
  }
  .select.open .menu { display: block; }
  
  /* Collapsible Group Headers */
  .mg { 
    margin: 10px 6px 2px; padding: 6px 8px; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); 
    display: flex; align-items: center; justify-content: space-between; border-radius: 8px; cursor: pointer; background: transparent; transition: background .15s;
    border: none; width: calc(100% - 12px); text-align: left; font-family: inherit;
  }
  .mg:hover { background: var(--field); }
  .mg::after { content: ""; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
  .mg.collapsed::after { transform: rotate(-135deg); }
  .group-content { display: block; transition: max-height .2s ease; overflow: hidden; }
  .group-content.collapsed { display: none; }

  .mi { display: block; padding: 8px 12px; border-radius: 9px; color: var(--text); text-decoration: none; font-weight: 500; }
  .mi:hover, .mi:focus-visible { background: var(--field); outline: none; }
  
  /* aufklappbare Untergruppe innerhalb einer Gruppe */
  .ms { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--text); font: inherit; font-weight: 500; text-align: left; cursor: pointer; }
  .ms { text-decoration: underline dashed 0.5px var(--accent); text-underline-offset: 5px; }
  .ms:hover, .ms:focus-visible { background: var(--field); outline: none; }
  .ms::after { content: ""; width: 7px; height: 7px; margin-right: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  .ms[aria-expanded=true]::after { transform: rotate(45deg); }
  .msub { display: none; margin: 0 0 2px 14px; padding-left: 4px; border-left: 2px solid var(--line); }
  .msub.on { display: block; }
  
  /* Lab thin font style */
  .mi.lab { color: var(--lab); font-weight: 300; margin-top: 8px; border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; padding-top: 12px; }
  
  .msg { color: var(--muted); margin-top: 16px; }
  .msg a, footer a { color: var(--link); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  /* top-Tools-Knopf neben dem Hell/Dunkel-Umschalter (oben rechts, fixiert) */
  .toplink { position: fixed; top: 12px; right: 52px; z-index: 50; width: 32px; height: 32px; padding: 0; border-radius: 50%; background: var(--card); opacity: .7; transition: opacity .15s, border-color .15s, background .15s; }
  .toplink svg { width: 16px; height: 16px; }
  @media (max-width: 600px) { .toplink { width: 32px; height: 32px; border-radius: 50%; } .toplink svg { width: 16px; height: 16px; } }
  .toplink:hover, .toplink:focus-visible, .toplink[aria-expanded="true"] { opacity: 1; border-color: var(--accent); background: var(--field); }
  .pop { position: fixed; z-index: 60; right: 12px; top: 52px; }
  /* «Chattas sbagls?» im Dropdown: gestrichelter Rahmen, Hinweis per ⓘ */
  .mchatta { margin: 4px 2px 2px; border: 0.5px dashed var(--accent); border-radius: 10px; }
  .mchatta-r { display: flex; align-items: center; }
  .mchatta .mi { flex: 1; }
  .chatta-i { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 30px; margin-right: 0; padding: 0; border: 0; background: none; color: var(--muted); cursor: help; border-radius: 50%; }
  .chatta-i svg { width: 16px; height: 16px; }
  .chatta-i:hover, .chatta-i:focus-visible, .mchatta.tip .chatta-i { color: var(--accent); outline: none; }
  .chatta-tip { display: none; margin: 0; padding: 0 12px 10px; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .mchatta.tip .chatta-tip { display: block; }
  /* Favurits: Stern im Dropdown, Kacheln unter dem Dropdown (pro Browser gespeichert) */
  .mi.fv { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .star { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; margin: -4px -6px -4px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; }
  .mchatta .star { margin: 0 6px 0 0; }
  .star:hover, .star:focus-visible { color: var(--accent); outline: none; }
  .star.on { color: var(--accent); }
  .favs { margin-top: 20px; }
  .favh { margin: 0 0 10px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .favgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .favcard { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); text-decoration: none; transition: border-color .15s; }
  .favcard:hover, .favcard:focus-visible { border-color: var(--accent); outline: none; }
  .favcard img { flex: none; width: 22px; height: 22px; }
  .favcard span { min-width: 0; display: flex; flex-direction: column; }
  .favcard b { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .favcard small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .favhint { color: var(--muted); font-size: 13px; }
  .favcard { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .favcard img { pointer-events: none; }
  .favgrid.sorting .favcard { transition: transform .12s; }
  .favcard.dragging { border-color: var(--accent); box-shadow: 0 8px 22px rgba(0,0,0,.35); transform: scale(1.03); z-index: 2; cursor: grabbing; }
  .favsort { margin-top: 8px; color: var(--muted); font-size: 12px; }
  /* «nov»: neue oder geänderte Tools, bis man sie geöffnet hat (pro Browser) */
  .nov { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent, #121214); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; vertical-align: 2px; line-height: 1.5; }
  .novcnt { display: inline-block; margin-left: 10px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; vertical-align: 2px; }
  .favcard .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  /* Versionsnummer ganz unten: v<Datum letzter Commit>_<Anzahl Commits an dem Tag>, live aus GitHub */
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { width: 100%; }
  .ver { margin: auto 0 0; padding: 0 16px 14px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .04em; opacity: .35; }
  .ver a { color: var(--accent); text-decoration: none; }
  .ver a:hover, .ver a:focus-visible { text-decoration: underline; outline: none; }
  #vnum:not(:empty)::after { content: " · "; }
  /* Stil wie in den Tools (theme.js): Rotverlauf für rote Texte, Milchglas für Kacheln und Menü */
  h1 span, .favh, .mg { background-image: var(--rgrad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .favcard, .sel-btn { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); border-color: var(--glass-line); }
  .menu { background: rgba(28,28,31,.78); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); border-color: var(--glass-line); }
  :root[data-theme="light"] .menu { background: rgba(255,255,255,.82); }
  .favcard:hover, .favcard:focus-visible, .sel-btn:hover, .sel-btn:focus-visible, .sel-btn[aria-expanded=true] { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>dombuzz <span>Tools</span></h1>
    <a class="toplink" id="toplink" href="/top" title="top Tools" aria-label="top Tools" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="12 14 76 76" aria-hidden="true"><g fill="#ff4d64"><rect x="18" y="52" width="18" height="32" rx="3" fill-opacity=".55"/><rect x="41" y="22" width="18" height="62" rx="3"/><rect x="64" y="40" width="18" height="44" rx="3" fill-opacity=".75"/></g></svg>
    </a>
    <div class="pop" id="pop" role="dialog" aria-label="top Tools">
      <div class="pop-h"><b>top <span>Tools</span></b>
        <div class="ptabs"><button class="ptab" data-r="today" aria-selected="false">oz</button><button class="ptab" data-r="week" aria-selected="false">emna</button><button class="ptab" data-r="month" aria-selected="true">mais</button><button class="ptab" data-r="30d" aria-selected="false">30 dis</button><button class="ptab" data-r="all" aria-selected="false">tut</button></div></div>
      <div id="plist"><div class="pmsg">Chargel …</div></div>
      <div class="pfoot" id="pmeta"></div>
    </div>
  </div>
  <p class="sub">Pitschens tools per la lavur da mintgadi tar RTR. Senza installaziun – tut funcziuna en il browser e vegn elavurà be localmain.<br>Tscherner in tool, el s'avra directamain.</p>
  <div class="select" id="selwrap">
    <button type="button" class="sel-btn" id="selbtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Tscherner in tool …</button>
    <div class="menu" id="menu" role="menu"></div>
  </div>
</main>
<footer class="ver" aria-label="Versiun"><a href="/info">Infus &amp; datas</a> · <span id="vnum"></span><a href="/game" id="vgame">game</a></footer>

<script>
  // Anzeigenamen im Dropdown (Dateiname -> Name).
  const NAMES = {
    'rtr-picture.html':    'RTR Picture-downloader',
    'visual.html':         'Magazin / Il di / #mument',
    'maletgs.html':        'Colurar, rotar e cumbinar',
    'colurs.html':         'Clerezza + colurs',
    'rotar.html':          'Rotar + drizzar',
    'Resizer2000.html':    'Resizer 2000',
    'Plan.html':           'Plans da teams',
    'artitgel.html':       "Links d'artitgels",
    'audio-recorder.html': 'Audio-Recorder',
    'srt2ttml.html':       'SRT → TTML',
    'studio.html':         'Subtitle Studio',
    'data.html':           'Memorisar grafica Datawrapper',
    'votgr.html':          'Chartas votaziuns GR'
  };

  // Gruppen und Reihenfolge im Dropdown.
  const GROUPS = [
    ['Maletgs',           ['rtr-picture.html', 'visual.html', 'maletgs.html', 'Resizer2000.html']],
    ['Redacziun',         ['Plan.html', 'artitgel.html']],
    ['Audio e suttitels', ['audio-recorder.html', 'srt2ttml.html', 'studio.html']],
    ['Grafica',           ['data.html', 'votgr.html']]
  ];

  const wrap = document.getElementById('selwrap'), btn0 = document.getElementById('selbtn'), menu = document.getElementById('menu');
  
  // Render dropdown groups dynamically with collapsible functionality
  function renderMenu() {
    menu.innerHTML = '';
    GROUPS.forEach(([groupName, items]) => {
      const groupBtn = document.createElement('button');
      groupBtn.type = 'button';
      groupBtn.className = 'mg';
      groupBtn.textContent = groupName;
      groupBtn.setAttribute('aria-expanded', 'true');
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'group-content';

      groupBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = groupBtn.getAttribute('aria-expanded') === 'true';
        groupBtn.setAttribute('aria-expanded', !expanded);
        groupBtn.classList.toggle('collapsed', expanded);
        contentDiv.classList.toggle('collapsed', expanded);
      });

      items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'mi';
        a.href = '/' + item.replace(/\.html?$/i, '');
        a.textContent = NAMES[item] || item;
        a.setAttribute('role', 'menuitem');
        contentDiv.appendChild(a);
      });

      menu.appendChild(groupBtn);
      menu.appendChild(contentDiv);
    });
  }
  renderMenu();

  // Toggle dropdown behavior
  btn0.addEventListener('click', () => {
    const isOpen = wrap.classList.toggle('open');
    btn0.setAttribute('aria-expanded', isOpen);
  });

  document.addEventListener('click', (e) => {
    if (!wrap.contains(e.target)) {
      wrap.classList.remove('open');
      btn0.setAttribute('aria-expanded', 'false');
    }
  });
</script>
</body>
</html>
