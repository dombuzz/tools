<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Ranking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 14 76 76'%3E%3Cg fill='%23ff4d64'%3E%3Crect x='18' y='52' width='18' height='32' rx='3' fill-opacity='.55'/%3E%3Crect x='41' y='22' width='18' height='62' rx='3'/%3E%3Crect x='64' y='40' width='18' height='44' rx='3' fill-opacity='.75'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#121214;--card:#1c1c1f;--field:#26262a;--text:#ececef;--muted:#9a9aa2;--line:#2f2f34;--accent:#ff4d64;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:40px 16px 64px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:640px;margin:0 auto}
  .homelink{display:inline-block;margin:0 0 10px;font-size:.85rem;color:#9a9aa2;text-decoration:none}
  .homelink:hover,.homelink:focus-visible{color:#ff4d64}
  h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-.01em}
  h1 .acc{color:var(--accent)}
  .lead{color:var(--muted);margin:0 0 20px;font-size:.9rem}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .tab:hover{color:var(--text)}
  .tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#121214}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0}
  .row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .rank{color:var(--muted);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
  .name{font-weight:600;font-size:.95rem;min-width:0}
  .name a{color:inherit;text-decoration:none}.name a:hover{color:var(--accent)}
  .bar{height:6px;border-radius:3px;background:var(--accent);margin-top:6px;min-width:3px;transition:width .3s}
  .row.zero .bar{background:#3a3a40}.row.zero .name{color:var(--muted)}
  .cnt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .cnt small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
  .meta{color:var(--muted);font-size:.82rem;margin-top:12px}
  .msg{padding:22px 18px;color:var(--muted);text-align:center;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <a class="homelink" href="/">← Tools</a>
  <h1><span class="acc">Ranking</span></h1>
  <p class="lead">Tge tools han gidà il pli savens da simplifitgar la lavur? Dumbrà vegnan ils clics sin «Gea» sut ils tools.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-r="all" aria-selected="true">entir temp</button>
    <button class="tab" role="tab" data-r="30d" aria-selected="false">ultims 30 dis</button>
    <button class="tab" role="tab" data-r="month" aria-selected="false">mais actual</button>
  </div>

  <div class="card" id="list"><div class="msg">Chargel …</div></div>
  <p class="meta" id="meta"></p>
</div>

<script>
  const API = 'https://fragrant-grass-c193.zappa-pfadi.workers.dev';
  // Anzeigenamen; Tools ohne Klick erscheinen mit 0
  const NAMES = {
    'rtr-picture': 'RTR Picture-downloader', 'visual': 'Magazin / Il di', 'Resizer2000': 'Resizer 2000',
    'PlanOnline': 'Plan Squadra online', 'audio-recorder': 'Audio-Recorder', 'srt2ttml': 'SRT → TTML',
    'subs': 'Suttitels RM → DE', 'data': 'Memorisar grafica Datawrapper', 'votgr': 'Chartas votaziuns GR'
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MONTHS = ['schaner', 'favrer', 'mars', 'avrigl', 'matg', 'zercladur', 'fanadur', 'avust', 'settember', 'october', 'november', 'december'];

  async function load(range) {
    const list = document.getElementById('list'), meta = document.getElementById('meta');
    list.innerHTML = '<div class="msg">Chargel …</div>'; meta.textContent = '';
    try {
      const r = await fetch(`${API}/ranking?range=${range}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const counts = Object.fromEntries(d.items.map(i => [i.tool, i.count]));
      const tools = [...new Set([...Object.keys(NAMES), ...Object.keys(counts)])]
        .map(t => ({ t, n: counts[t] || 0 }))
        .sort((a, b) => b.n - a.n || (NAMES[a.t] || a.t).localeCompare(NAMES[b.t] || b.t, 'de'));
      const max = Math.max(1, ...tools.map(x => x.n));
      let rank = 0, prev = null;
      list.innerHTML = tools.map((x, i) => {
        if (x.n !== prev) { rank = i + 1; prev = x.n; }
        const pct = d.total ? Math.round(x.n / d.total * 100) : 0;
        return `<div class="row${x.n ? '' : ' zero'}"><span class="rank">${x.n ? rank : '–'}</span>
          <div class="name"><a href="/${esc(x.t)}">${esc(NAMES[x.t] || x.t)}</a><div class="bar" style="width:${x.n / max * 100}%"></div></div>
          <span class="cnt">${x.n.toLocaleString('de-CH')}<small>${x.n ? pct + ' %' : ''}</small></span></div>`;
      }).join('');
      const now = new Date();
      const label = { all: 'Dapi il cumenzament', '30d': 'Ils ultims 30 dis', month: `${MONTHS[now.getMonth()]} ${now.getFullYear()}` }[range];
      meta.textContent = `${label} · ${d.total.toLocaleString('de-CH')} ${d.total === 1 ? 'clic' : 'clics'} en total`;
    } catch (e) {
      list.innerHTML = '<div class="msg">Las datas n\'han betg pudì vegnir chargiadas. Emprova pli tard.</div>';
    }
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    load(b.dataset.r);
  });
  load('all');
</script>
</body>
</html>
