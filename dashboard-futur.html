<!doctype html>
<html lang="rm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07081a">
<title>Dashboard · futur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23ff4d64'/%3E%3Cstop offset='.5' stop-color='%23b46cff'/%3E%3Cstop offset='1' stop-color='%235ad1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='url(%23g)' stroke-width='12'/%3E%3C/svg%3E">
<style>
/* Prototyp «Futuristisch» des Dashboards: gleiche Daten wie /dashboard, eigener Look. Keine Zählung. */
:root{
  --bg:#07081a;--glass:rgba(143,152,255,.07);--glass2:rgba(143,152,255,.12);--edge:rgba(143,152,255,.28);
  --text:#eef0ff;--muted:#9aa3d9;--dim:#5f679c;
  --a1:#ff4d64;--a2:#b46cff;--a3:#5ad1ff;--grad:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));
  --ok:#5fe3b0;--wa:#ffc46b;color-scheme:dark
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 16px 64px;
  background:radial-gradient(60% 40% at 10% 0%,rgba(180,108,255,.18),transparent 70%),radial-gradient(50% 35% at 100% 20%,rgba(90,209,255,.12),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(255,77,100,.10),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(143,152,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(143,152,255,.06) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
.wrap{position:relative;max-width:560px;margin:0 auto;display:grid;gap:14px}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.top a{text-decoration:none}.top a:hover{color:var(--text)}
.h{font-size:.7rem;letter-spacing:.32em;color:#8f98ff;text-transform:uppercase;margin:0}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* Zeitraum */
.seg{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);position:relative}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:inherit;font-size:.82rem;font-weight:500;letter-spacing:.04em;padding:8px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .2s}
.seg button[aria-selected=true]{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--grad);opacity:.9;transition:left .35s cubic-bezier(.3,1.2,.4,1),width .35s;box-shadow:0 0 18px rgba(180,108,255,.45)}
/* Hero */
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:4.4rem;font-weight:200;line-height:.95;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.sub{font-size:.85rem;color:var(--muted);margin-top:4px}.sub b{color:var(--a1);font-weight:500}
.ring{--p:0;width:92px;height:92px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--a1) 0,var(--a2) calc(var(--p)*.5%),var(--a3) calc(var(--p)*1%),rgba(143,152,255,.14) calc(var(--p)*1%) 100%)}
.ring div{width:74px;height:74px;border-radius:50%;background:#0d0f26;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:1.05rem;font-weight:300}.ring small{display:block;font-size:.58rem;letter-spacing:.14em;color:var(--dim)}
/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t{background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:12px 14px}
.t b{display:block;font-size:1.7rem;font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums}
.t span{font-size:.75rem;color:var(--muted)}
/* Verlauf */
.spark{display:block;width:100%;height:90px;margin-top:8px}
.leg{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-top:4px}
/* Rangliste */
.rk{display:grid;gap:10px;margin-top:10px}
.r{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;font-size:.88rem;text-decoration:none}
.r i{font-style:normal;color:var(--dim);font-size:.75rem;font-variant-numeric:tabular-nums}
.r em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:300}
.r .bar{grid-column:2/-1;height:3px;border-radius:2px;background:rgba(143,152,255,.12);overflow:hidden}
.r .bar u{display:block;height:100%;background:var(--grad);border-radius:2px;box-shadow:0 0 10px rgba(180,108,255,.6)}
/* Status */
.st{display:grid;grid-template-columns:1fr;gap:8px;font-size:.8rem;margin-top:10px}
.st div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(143,152,255,.12);padding-bottom:6px}
.st span{color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;vertical-align:1px}
.dot.wa{background:var(--wa);box-shadow:0 0 8px var(--wa)}
.fb{font-size:.85rem;margin-top:8px;color:var(--muted)}.fb q{display:block;color:var(--text);margin-top:4px}
/* Login */
.lock{max-width:340px;margin:16vh auto 0;text-align:center;display:grid;gap:12px}
.lock input{width:100%;padding:13px 14px;font:inherit;color:var(--text);background:var(--glass2);border:1px solid var(--edge);border-radius:14px;outline:none;text-align:center}
.lock input:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(180,108,255,.25)}
.lock button{padding:12px;font:inherit;font-weight:600;color:#fff;background:var(--grad);border:0;border-radius:14px;cursor:pointer}
.err{color:var(--a1);font-size:.85rem;min-height:1.3em;margin:0}
.locked .app{display:none}html:not(.locked) .lock{display:none}
.foot{text-align:center;font-size:.72rem;color:var(--dim);margin-top:6px}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('locked')</script>
<div class="wrap">
  <form class="lock glass" id="lock" autocomplete="off">
    <p class="h">Dashboard</p>
    <input type="password" id="pw" placeholder="Pled-clav" aria-label="Pled-clav" autocomplete="current-password" required>
    <button type="submit">Avrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="app wrap" style="padding:0">
    <div class="top"><a href="/dashboard">← Dashboard classic</a><span id="clock">–</span></div>
    <p class="h" id="rlabel">Dashboard · entir temp</p>

    <div class="seg" role="tablist" id="seg">
      <span class="pill" id="pill"></span>
      <button role="tab" data-r="today">oz</button><button role="tab" data-r="week">emna</button><button role="tab" data-r="month">mais</button><button role="tab" data-r="30d">30 dis</button><button role="tab" data-r="all">tut</button>
    </div>

    <section class="glass hero">
      <div><div class="big" id="uses">–</div><div class="sub">giadas duvrà · <b id="likes">♥ –</b></div></div>
      <div class="ring" id="ring" title="Contingent Cloudflare oz"><div><span><b id="cfp">–</b><small>CLOUDFLARE</small></span></div></div>
    </section>

    <div class="grid" id="tiles"></div>

    <section class="glass">
      <p class="h">Activitad</p>
      <svg class="spark" id="spark" viewBox="0 0 300 90" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="leg"><span id="lf"></span><span><span style="color:var(--a2)">━</span> duvrà &nbsp; <span style="color:var(--dim)">┄</span> visitas</span><span>ussa</span></div>
    </section>

    <section class="glass">
      <p class="h">Rangaziun</p>
      <div class="rk" id="rank"></div>
    </section>

    <section class="glass">
      <p class="h">Sistem</p>
      <div class="st" id="sys"></div>
      <div class="fb" id="fb"></div>
    </section>

    <p class="foot">Prototip «futur» · las datas èn las medemas sco sin <a href="/dashboard">/dashboard</a></p>
  </div>
</div>

<script>
const API = 'https://fragrant-grass-c193.zappa-pfadi.workers.dev';
const NAMES = {
  'rtr-picture': 'RTR Picture-downloader', 'visual': 'Magazin / Il di / #mument', 'maletgs': 'Elavurar maletgs', 'Resizer2000': 'Resizer 2000',
  'Plan': 'Plans da teams', 'artitgel': "Links d'artitgels", 'artitgel-challenge': 'Artitgel-challenge', 'audio-recorder': 'Audio-Recorder', 'srt2ttml': 'SRT → TTML', 'studio': 'Subtitle Studio',
  'data': 'Memorisar grafica Datawrapper', 'votgr': 'Chartas votaziuns GR'
};
const LABEL = { today: 'oz', week: "quest'emna", month: 'mais actual', '30d': 'ultims 30 dis', all: 'entir temp' };
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('de-CH');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let pw = ''; try { pw = localStorage.getItem('dbz-fb-pw') || ''; } catch (e) {}
let range = 'all'; try { const v = localStorage.getItem('dbz-futur-range'); if (LABEL[v]) range = v; } catch (e) {}

// Login: dasselbe Passwort wie /dashboard (Cloudflare-Secret FEEDBACK_PASSWORD, geprüft vom Worker)
async function check(p) {
  const r = await fetch(API + '/feedback', { headers: { Authorization: 'Bearer ' + p }, cache: 'no-store' });
  if (r.status === 401) return null; if (!r.ok) throw new Error(r.status);
  return (await r.json()).items || [];
}
function unlock(fb) { document.documentElement.classList.remove('locked'); requestAnimationFrame(pill); showFb(fb); load(); setInterval(load, 5 * 60 * 1000); }
$('lock').onsubmit = async e => {
  e.preventDefault(); const p = $('pw').value; $('err').textContent = '';
  try { const fb = await check(p); if (!fb) { $('err').textContent = 'Pled-clav sbaglià.'; return; } pw = p; try { localStorage.setItem('dbz-fb-pw', p); } catch (x) {} unlock(fb); }
  catch (x) { $('err').textContent = "Il server n'è betg cuntanschibel."; }
};

// Zeitraum mit gleitender Pille
function pill() { const b = $('seg').querySelector('[aria-selected=true]'); if (!b) return; $('pill').style.left = b.offsetLeft + 'px'; $('pill').style.width = b.offsetWidth + 'px'; }
$('seg').querySelectorAll('button').forEach(b => b.onclick = () => { range = b.dataset.r; try { localStorage.setItem('dbz-futur-range', range); } catch (e) {} mark(); load(); });
function mark() { $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.r === range)); pill(); $('rlabel').textContent = 'Dashboard · ' + LABEL[range]; }
addEventListener('resize', pill);

// Zahl hochzählen
function count(el, to, pre = '') {
  const from = +(el.dataset.v || 0); el.dataset.v = to; const t0 = performance.now(), d = 700;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

async function load() {
  const now = new Date(); $('clock').textContent = now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  const get = p => fetch(API + p).then(r => r.ok ? r.json() : Promise.reject(r.status));
  const [d, h, u] = await Promise.all([get('/ranking?range=' + range).catch(() => null), get('/hourly?range=' + range).catch(() => null), get('/usage').catch(() => null)]);
  if (d) {
    const main = x => !String(x.tool).startsWith('lab-');
    const uses = (d.uses || []).filter(main), likes = (d.items || []).filter(main);
    count($('uses'), uses.reduce((t, x) => t + x.count, 0));
    count($('likes'), likes.reduce((t, x) => t + x.count, 0), '♥ ');
    const T = [[d.clients, 'visitaders unics'], [d.returning, 'visitaders regulars']];
    if (range === 'week' && d.newClients != null) T.push([d.newClients, "per l'emprima giada"], [Math.max(0, (d.clients || 0) - d.newClients), 'enconuschents']);
    T.push([d.viewsTotal, 'visitas']);
    if (d.usingClients) T.push([String(d.usesPerClient).replace('.', ','), 'Ø per visitader activ']);
    $('tiles').innerHTML = T.map(([v, l]) => `<div class="t"><b>${typeof v === 'string' ? v : fmt(v)}</b><span>${l}</span></div>`).join('');
    const rows = uses.filter(x => x.count).slice(0, 8), mx = Math.max(1, ...rows.map(x => x.count));
    $('rank').innerHTML = rows.length ? rows.map((x, i) => `<a class="r" href="/${esc(x.tool)}"><i>${String(i + 1).padStart(2, '0')}</i><span>${esc(NAMES[x.tool] || x.name || x.tool)}</span><em>${fmt(x.count)}</em><span class="bar"><u style="width:${x.count / mx * 100}%"></u></span></a>`).join('')
      : '<span class="sub">Anc naginas utilisaziuns en quest temp.</span>';
  }
  if (h) spark(h);
  if (u) {
    const L = u.logs || {}, pl = L.configured && !L.error && L.limitBytes ? L.bytes / L.limitBytes * 100 : 0;
    const p = Math.max(u.read / u.limitRead * 100, u.written / u.limitWritten * 100, pl);
    $('ring').style.setProperty('--p', Math.min(100, p).toFixed(1)); $('cfp').textContent = (p < 1 && p > 0 ? '<1' : Math.round(p)) + ' %';
    $('sys').innerHTML = [
      ['Cloudflare', `<span class="dot${p >= 50 ? ' wa' : ''}"></span>${p >= 50 ? 'attenziun' : 'tut en urden'}`],
      ['Lingias legidas', fmt(u.read)], ['Lingias scrittas', fmt(u.written)],
      ['Logs', L.bytes != null && !L.error ? '≈ ' + (L.bytes / 1e6).toFixed(1).replace('.', ',') + ' MB' : '–'],
    ].map(([a, b]) => `<div><span>${a}</span><b style="font-weight:400">${b}</b></div>`).join('');
  }
}

// Verlauf: oz/emna pro Stunde, sonst pro Tag
function spark(h) {
  const short = range === 'today' || range === 'week', key = x => short ? x.h : x.h.slice(0, 10);
  const map = (a) => { const m = new Map(); (a || []).forEach(x => m.set(key(x), (m.get(key(x)) || 0) + x.n)); return m; };
  const U = map(h.uses), V = map(h.views), keys = [...new Set([...U.keys(), ...V.keys()])].sort();
  const svg = $('spark');
  if (keys.length < 2) { svg.innerHTML = ''; $('lf').textContent = ''; return; }
  const uv = keys.map(k => U.get(k) || 0), vv = keys.map(k => V.get(k) || 0), mx = Math.max(1, ...uv, ...vv), W = 300, H = 90, n = keys.length - 1;
  const pts = a => a.map((v, i) => `${(i / n * W).toFixed(1)},${(H - 4 - v / mx * (H - 12)).toFixed(1)}`).join(' ');
  svg.innerHTML = `<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ff4d64"/><stop offset=".5" stop-color="#b46cff"/><stop offset="1" stop-color="#5ad1ff"/></linearGradient>
    <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b46cff" stop-opacity=".35"/><stop offset="1" stop-color="#b46cff" stop-opacity="0"/></linearGradient></defs>
    <polyline points="${pts(vv)}" fill="none" stroke="#5f679c" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <polygon points="0,${H} ${pts(uv)} ${W},${H}" fill="url(#sf)"/>
    <polyline points="${pts(uv)}" fill="none" stroke="url(#sg)" stroke-width="2" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px rgba(180,108,255,.8))"/>`;
  const f = keys[0]; $('lf').textContent = short ? f.slice(8, 10) + '.' + f.slice(5, 7) + '.' : +f.slice(8, 10) + '.' + +f.slice(5, 7) + '.';
}

function showFb(items) {
  const nov = (items || []).filter(i => (i.status || 'nov') === 'nov');
  $('fb').innerHTML = nov.length ? `<span class="dot wa"></span>${nov.length} ${nov.length === 1 ? 'feedback nov' : 'feedbacks novs'} · <a href="/feedback">avrir</a><q>${esc(nov[0].text).slice(0, 140)}</q>` : '<span class="dot"></span>Nagin feedback nov';
}

mark();
if (pw) check(pw).then(fb => fb ? unlock(fb) : $('pw').focus()).catch(() => { $('err').textContent = "Il server n'è betg cuntanschibel."; });
else $('pw').focus();
</script>
</body>
</html>
